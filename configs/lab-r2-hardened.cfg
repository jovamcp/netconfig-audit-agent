! LAB-R2 - synthetic lab configuration showing the hardened baseline.
! Not taken from any real device. All hashes and keys are fake placeholders.
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname LAB-R2
!
enable secret 9 $9$EXAMPLEONLY$notARealHashUseYourOwnSecretHere000000000000
!
username admin privilege 15 secret 9 $9$EXAMPLEONLY$notARealHashUseYourOwnSecretHere111111111111
!
aaa new-model
aaa authentication login default group radius local
aaa authentication login CONSOLE local
aaa authorization exec default group radius local
!
no ip source-route
ip domain name lab.local
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
interface GigabitEthernet0/0
 description WAN to ISP
 ip address 203.0.113.6 255.255.255.252
 ip access-group OUTSIDE-IN in
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no cdp enable
!
interface GigabitEthernet0/1
 description LAN users
 ip address 10.10.20.1 255.255.255.0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 6 EXAMPLEONLYAESKEY
!
interface GigabitEthernet0/2
 description Unused
 no ip address
 shutdown
!
router ospf 1
 passive-interface GigabitEthernet0/0
 network 10.10.20.0 0.0.0.255 area 0
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 203.0.113.5
!
ip access-list standard MGMT-ONLY
 permit 10.10.99.0 0.0.0.255
 deny any log
!
ip access-list extended OUTSIDE-IN
 permit tcp 198.51.100.0 0.0.0.255 host 203.0.113.6 eq 22
 permit icmp any host 203.0.113.6 echo-reply
 deny ip any any log
!
logging host 10.10.99.50
logging trap informational
ntp server 10.10.99.10
!
snmp-server group NMS v3 priv access MGMT-ONLY
!
radius server LAB-RADIUS
 address ipv4 10.10.99.20 auth-port 1812 acct-port 1813
 key 6 EXAMPLEONLYAESKEY
!
banner login ^Authorized access only. Activity is monitored.^
!
line con 0
 exec-timeout 10 0
 login authentication CONSOLE
line aux 0
 no exec
 transport input none
line vty 0 15
 access-class MGMT-ONLY in
 exec-timeout 10 0
 transport input ssh
!
end
