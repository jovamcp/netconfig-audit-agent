! LAB-SW1 - synthetic lab configuration for an access-layer switch.
! Not taken from any real device. All passwords, hashes and keys are fake examples.
! Contains intentional misconfigurations for audit testing.
!
version 15.2
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
!
hostname LAB-SW1
!
logging buffered 64000 informational
enable secret 9 $9$EXAMPLEONLY$notARealHashUseYourOwnSecretHere222222222222
!
username admin privilege 15 secret 9 $9$EXAMPLEONLY$notARealHashUseYourOwnSecretHere333333333333
username netops privilege 15 password 7 094F471A1A0A464058
!
aaa new-model
aaa authentication login default local
aaa authentication login CONSOLE local
aaa authorization exec default local
!
clock timezone UTC 0
no ip source-route
no ip domain lookup
ip domain name lab.local
!
ip dhcp snooping vlan 10,20
ip dhcp snooping
ip arp inspection vlan 10,20
!
login block-for 120 attempts 5 within 60
login on-failure log
login on-success log
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
vlan 10
 name USERS
vlan 20
 name VOICE
vlan 99
 name MGMT
vlan 999
 name PARKING
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
interface GigabitEthernet1/0/1
 description Uplink to LAB-DSW1
 switchport trunk allowed vlan 10,20,99
 switchport mode dynamic desirable
 ip dhcp snooping trust
 ip arp inspection trust
!
interface range GigabitEthernet1/0/2 - 12
 description User access ports
 switchport access vlan 10
 switchport mode access
 switchport voice vlan 20
 switchport nonegotiate
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security aging time 10
 switchport port-security
 storm-control broadcast level 5.00
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
!
interface range GigabitEthernet1/0/13 - 16
 description Meeting room ports
 switchport access vlan 10
 switchport mode access
 switchport nonegotiate
 storm-control broadcast level 5.00
 spanning-tree portfast
 spanning-tree bpduguard enable
 ip dhcp snooping limit rate 15
!
interface range GigabitEthernet1/0/17 - 20
 description Unused
 switchport access vlan 999
 switchport mode access
 switchport nonegotiate
 shutdown
!
interface range GigabitEthernet1/0/21 - 24
 description Spare
 switchport mode access
 spanning-tree portfast
!
interface Vlan1
 no ip address
 shutdown
!
interface Vlan99
 description Management
 ip address 10.10.99.11 255.255.255.0
 no ip redirects
 no ip proxy-arp
!
ip default-gateway 10.10.99.1
ip http server
no ip http secure-server
!
ip access-list standard MGMT-HOSTS
 permit 10.10.99.0 0.0.0.255
 deny   any log
!
logging trap informational
logging source-interface Vlan99
logging host 10.10.99.50
!
snmp-server community LabMonRO2024 RO MGMT-HOSTS
snmp-server community LabCfgRW2024 RW
snmp-server location Lab rack 1
snmp-server contact lab-admin@lab.local
!
ntp authentication-key 1 md5 EXAMPLEONLYNTPKEY
ntp authenticate
ntp trusted-key 1
ntp server 10.10.99.50 key 1
!
banner login ^C
Authorized access only. Activity is logged.
^C
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login authentication CONSOLE
line vty 0 4
 access-class MGMT-HOSTS in
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 exec-timeout 10 0
 transport input telnet ssh
!
end
